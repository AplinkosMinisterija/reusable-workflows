name: Composer update

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Optional input to set an operating systems which the workflow uses. Defaults to ubuntu-latest if not set"
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Optional input to set timeout minutes. Defaults to 45, leaving room for validate-command (e.g. a Docker build) before auto-merging"
        required: false
        type: number
        default: 45
      node-version:
        description: "Optional input to set node version"
        required: false
        type: string
        default: "20.x"
      composer-version:
        description: "Optional input to set the composer Docker image tag used for outdated/update. Defaults to 2 (floating major), so the image keeps receiving PHP security rebuilds; superseded tags such as 2.6.5 or 2.8.12 are never rebuilt and roave/security-advisories now conflicts with their vulnerable PHP"
        type: string
        required: false
        default: "2"
      branch-prefix:
        description: "Optional input to set branch prefix. Defaults to composer-update"
        type: string
        required: false
        default: composer-update
      pr-reviewers:
        description: "Optional input to set PR reviewers"
        type: string
        required: false
        default: ""
      pr-labels:
        description: "Optional input to set PR labels"
        type: string
        required: false
        default: ""
      pr-base-branch:
        description: "Optional input to set PR's base branch. Defaults to main"
        type: string
        required: false
        default: "main"
      checkout-ref:
        description: "Optional git ref to checkout for update checks. When empty, uses pr-base-branch. Useful when the caller runs from a different branch."
        type: string
        required: false
        default: ""
      auto-merge:
        description: "Automatically merge the PR after creation using merge commit"
        type: boolean
        required: false
        default: false
      validate-command:
        description: "Optional shell command run on the updated checkout before auto-merging, e.g. `docker build --pull .`. A PR opened with GITHUB_TOKEN never gets pull_request workflow runs, so this is the only way to validate the update before it lands; if it fails the PR is left open and the job fails"
        type: string
        required: false
        default: ""
      debug:
        description: "Enable verbose logging for troubleshooting"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  composer-update:
    name: Composer update
    runs-on: ${{inputs.runs-on}}
    timeout-minutes: ${{inputs.timeout-minutes}}
    env:
      update_needed: 'false'
      BRANCH_NAME: ''
      has_changes: 'false'
      DEBUG: ${{ inputs.debug }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || inputs.pr-base-branch }}

      - name: Use Node.js ${{inputs.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{inputs.node-version}}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Pre-pull Composer Image (Cache Optimization)
        run: docker pull composer:${{ inputs.composer-version }}

      - name: Check for Composer updates (via Docker)
        id: check-updates
        run: |
          echo "🔍 Running composer outdated..."
          UPDATE_NEEDED="$(docker run --rm -v "$PWD:/app" -w /app composer:${{ inputs.composer-version }} sh -c '
            set -e
            git config --global --add safe.directory /app
            composer install --no-progress --prefer-dist --no-interaction
            set +e
            if [ "${DEBUG:-false}" = "true" ]; then
              echo "--- composer outdated (debug) ---"
              composer outdated --strict --no-interaction --no-ansi
              echo "--- end ---"
            else
              composer outdated --strict --no-interaction --no-ansi >/dev/null 2>&1
            fi
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo false
            elif [ "$code" -eq 1 ]; then
              echo true
            else
              exit "$code"
            fi
          ')"
          echo "update_needed=$UPDATE_NEEDED" >> "$GITHUB_ENV"
          echo "🔄 Update needed: $UPDATE_NEEDED"

      - name: Set Update Branch Name
        run: |
          BRANCH_NAME="${{inputs.branch-prefix}}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "RUN_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "🌿 Branch name: $BRANCH_NAME"

      - name: Update Composer (via Docker)
        if: env.update_needed == 'true'
        run: |
          echo "🚀 Running composer update..."
          docker run --rm -v "$PWD:/app" -w /app composer:${{ inputs.composer-version }} sh -c "
            git config --global --add safe.directory /app &&
            composer update --no-progress --prefer-dist --no-interaction
          "

      - name: Check for Changes
        if: env.update_needed == 'true'
        run: |
          CHANGES="$(git status --porcelain composer.json composer.lock)"
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> "$GITHUB_ENV"
            echo "✅ Changes detected in composer files."
          else
            echo "has_changes=false" >> "$GITHUB_ENV"
            echo "✅ No changes detected."
          fi

      - name: Validate update
        id: validate
        if: env.update_needed == 'true' && env.has_changes == 'true' && inputs.auto-merge && inputs.validate-command != ''
        continue-on-error: true
        run: |
          echo "🔎 Running validate-command on the updated checkout..."
          bash -eo pipefail -c "$VALIDATE_COMMAND"
        env:
          VALIDATE_COMMAND: ${{ inputs.validate-command }}

      - name: Create Pull Request
        id: create-pr
        if: env.update_needed == 'true' && env.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH_NAME }}
          base: ${{inputs.pr-base-branch}}
          add-paths: |
            composer.json
            composer.lock
          commit-message: "Auto update composer (${{ env.RUN_DATE }})"
          title: "Composer auto update"
          body: "This PR updates composer packages to the latest version. Last update: ${{ env.RUN_DATE }}."
          labels: ${{inputs.pr-labels}}
          reviewers: ${{inputs.pr-reviewers}}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge Pull Request
        if: inputs.auto-merge && contains(fromJSON('["created", "updated"]'), steps.create-pr.outputs.pull-request-operation)
        run: |
          # GitHub does not run pull_request workflows for a PR opened with GITHUB_TOKEN
          # (the run is recorded with no jobs and fails once the PR closes), so the PR's own
          # CI can never gate this merge. `validate-command` is that gate: merge only when it
          # passed or was not requested; otherwise leave the PR open for a human.
          case "$VALIDATE_OUTCOME" in
            success|skipped)
              gh pr merge --merge "$PR_NUMBER" ;;
            *)
              echo "::error::validate-command failed - PR #$PR_NUMBER left open for manual review, not merged"
              exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
